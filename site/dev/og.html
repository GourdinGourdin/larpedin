<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image source</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--bg); }
  .og { display: grid; grid-template-columns: 1fr 420px; gap: 72px; align-items: center; height: 100%; padding: 56px 84px; box-sizing: border-box; }
  .brand { font-size: 34px; gap: 16px; margin-bottom: 36px; }
  h1 { line-height: 1.04; }
  .brand img { width: 60px; height: 60px; }
  h1 { font-size: 68px; margin: 0 0 32px; }
  .games { display: flex; gap: 22px; font: 700 23px/1 var(--font-display); color: var(--ink-2); }
  .games span { display: flex; align-items: center; gap: 9px; }
  .games .dot { width: 12px; height: 12px; }
  .board-card { max-width: none; margin: 0; padding: 20px; }
</style>
</head>
<body>
<div class="og">
  <div>
    <div class="brand"><img src="../assets/icon.svg" alt="">LarpedIn</div>
    <h1>LinkedIn's daily puzzles, solved in milliseconds.</h1>
    <div class="games">
      <span><i class="dot dot-zip"></i>Zip</span><span><i class="dot dot-queens"></i>Queens</span><span><i class="dot dot-tango"></i>Tango</span><span><i class="dot dot-patches"></i>Patches</span><span><i class="dot dot-wend"></i>Wend</span>
    </div>
  </div>
  <figure class="board-card"><img src="../assets/games/zip.svg" alt=""></figure>
</div>
</body>
</html>
