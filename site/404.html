<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | LarpedIn</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7F0E1">
  <meta name="color-scheme" content="light">
  <script>
    /* Assets are relative to the site root, which is /larpedin/ on GitHub Pages and / elsewhere. */
    (function () {
      var base = location.pathname.indexOf('/larpedin/') === 0 ? '/larpedin/' : '/';
      document.write('<base href="' + base + '">');
      var t = 'light';
      try { if (localStorage.getItem('larpedin-theme') === 'dark') t = 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#17130F' : '#F7F0E1');
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', t);
    })();
  </script>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="lost" id="main">
    <a class="brand" href="./">
      <img src="assets/icon.svg" width="40" height="40" alt="">
      <span>LarpedIn</span>
    </a>
    <h1>This page doesn't exist</h1>
    <p>The link may be old or mistyped.</p>
    <a class="btn btn-big" href="./">Back to LarpedIn</a>
  </main>
</body>
</html>
