<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LarpedIn</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 320px; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  header h1 { font-size: 15px; letter-spacing: -.01em; }
  header .ver { font-size: 12px; color: var(--ll-muted); }
  header .grow { flex: 1; }
  main { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .status { padding: 12px; display: flex; flex-direction: column; gap: 10px; border-top: 3px solid var(--acc); }
  .status-line { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .status-line .state { width: 8px; height: 8px; border-radius: 50%; background: var(--ll-muted); flex: none; }
  .status[data-phase="done"] .state { background: var(--ll-success); }
  .status[data-phase="error"] .state { background: var(--ll-danger); }
  .status[data-phase="idle"].on-game .state { background: var(--acc); }
  .status-detail { font-size: 13px; color: var(--ll-muted); }
  .status .btn { width: 100%; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ll-muted); margin: 4px 4px 0; }
  .games { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .games a {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; text-decoration: none;
    background: var(--ll-surface); border: 1px solid var(--ll-border); font-weight: 600;
  }
  .games a:hover { border-color: var(--acc); }
  .games a[aria-current="page"] { border-color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
  .rows { padding: 4px 12px; }
  .rows > * { padding: 8px 0; }
  .rows > * + * { border-top: 1px solid var(--ll-border); }
  .kbd-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; }
  .kbd-row .right { display: flex; align-items: center; gap: 8px; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 12px; font-size: 12px; color: var(--ll-muted); }
</style>
</head>
<body>
<header>
  <span class="mark" data-mark="32"></span>
  <div class="grow"><h1>LarpedIn</h1><span class="ver" id="ver"></span></div>
  <button class="ghost" id="options" type="button" aria-label="Open settings and help">Settings</button>
</header>
<main>
  <section class="card status" id="status" data-phase="idle" aria-live="polite">
    <div>
      <div class="status-line"><span class="state" aria-hidden="true"></span><span id="status-title">Checking this tab…</span></div>
      <p class="status-detail" id="status-detail"></p>
    </div>
    <button class="btn" id="solve" type="button" hidden>Solve now</button>
  </section>

  <h2 id="games-h">Today's puzzles</h2>
  <nav class="games" id="games" aria-labelledby="games-h"></nav>

  <section class="card rows">
    <label class="toggle-row" for="auto">
      <span>Auto-solve<span class="sub">Solve as soon as a new board appears</span></span>
      <input type="checkbox" role="switch" class="switch" id="auto">
    </label>
    <div class="kbd-row">
      <span>Shortcut</span>
      <span class="right"><span id="shortcut"></span><button class="linkish" id="change-shortcut" type="button">Change</button></span>
    </div>
  </section>
</main>
<footer><span>Not affiliated with LinkedIn</span><span id="privacy">Runs locally</span></footer>
<script src="popup.js"></script>
</body>
</html>
